<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bubble Sort — natural pace</title><style>
*{box-sizing:border-box}body{margin:0;background:#192923;color:#eff5ed;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:28px 20px}h1{font-size:36px;letter-spacing:-1px;margin-bottom:8px}p{color:#bbcab9;line-height:1.5}section{background:#22372c;border:1px solid #52634e;border-radius:24px;margin:24px 0;overflow:hidden}.top{display:flex;justify-content:space-between;gap:12px;padding:20px;flex-wrap:wrap;font-size:14px}svg{display:block;width:100%;max-height:380px}.caption{padding:0 24px 24px;min-height:104px}.caption h2{font-size:21px;margin:0 0 8px}.caption p{margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid #52634e;background:#22372c;color:#eff5ed;cursor:pointer}button.primary{background:#d0e9aa;color:#192923;font-weight:650}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f1cc79;outline-offset:3px}button:disabled{opacity:.4}label{display:flex;align-items:center;gap:8px;margin-left:auto}input{width:100%;height:44px;accent-color:#d0e9aa}.note{font-size:13px}@media(max-width:480px){main{padding:16px 12px}label{margin-left:0}.caption{min-height:140px;padding:0 16px 20px}.controls button{padding:10px 12px}}
</style></head><body><main><h1>Bubble Sort</h1><p>Watch larger values travel right, one neighbor at a time.</p><section><div class="top"><strong id="pass">Ready to sort</strong><span>Gold: current pair · ✓: final position</span></div><svg viewBox="0 0 640 330" role="img" aria-labelledby="title"><title id="title">Unsorted values: 7, 3, 5, 2, 4</title><path d="M60 260H580" stroke="#52634e"/><g id="bars"></g><g id="positions"></g><path id="bracket" stroke="#f1cc79" stroke-width="2" fill="none"/></svg><div class="caption" aria-live="polite"><h2 id="heading">Five values. Smallest goes left.</h2><p id="reason">Press Play to follow each comparison and swap.</p></div></section><div class="controls"><button id="reset">Restart</button><button id="back">Previous</button><button class="primary" id="play">Play</button><button id="next">Next</button><label>Pace <select id="speed"><option value="1800">Normal</option><option value="3000">Slower</option><option value="1100">Faster</option></select></label></div><input id="seek" type="range" min="0" value="0" aria-label="Comparison step"><p class="note" id="count"></p><p class="note">Interactive concept preview. Existing project layout and themes stay unchanged.</p></main>
<style>
/* Color follows value; outlines and checks communicate algorithm state. */
#bars>g:nth-child(1) rect{fill:#c45d75}
#bars>g:nth-child(2) rect{fill:#387faa}
#bars>g:nth-child(3) rect{fill:#8763bb}
#bars>g:nth-child(4) rect{fill:#b67b30}
#bars>g:nth-child(5) rect{fill:#258b80}
#bars rect{stroke:#dce9e4;stroke-width:1.5}
#bars rect[stroke="#f1cc79"]{stroke:#ffe29a;stroke-width:4;filter:drop-shadow(0 0 7px #f1cc7940)}
#bars rect[stroke="#d0e9aa"]{stroke:#9bf0bb;stroke-width:3}
#bars text:nth-child(3){fill:#9bf0bb;font-weight:700}
#bracket{stroke:#ffe29a;stroke-width:3}
.top span{max-width:40ch;line-height:1.5}
.caption h2{color:#ffe29a}
</style>
<script>
document.querySelector('.top span').textContent='Color follows each value · Gold outline: comparing · ✓: final position';
</script>
<script>
(()=>{const $=id=>document.getElementById(id),values=[7,3,5,2,4],frames=[{order:[0,1,2,3,4],sorted:5,pass:0}],ns='http://www.w3.org/2000/svg';let order=[0,1,2,3,4];for(let end=4;end>0;end--){for(let j=0;j<end;j++){const pair=[order[j],order[j+1]],swap=values[pair[0]]>values[pair[1]],before=[...order];if(swap)[order[j],order[j+1]]=[order[j+1],order[j]];frames.push({order:[...order],before,pair,swap,j,pass:5-end,sorted:j===end-1?end:end+1});}}frames.push({order:[...order],sorted:0,pass:4});function el(tag,attrs,parent,text){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);e.textContent=text||'';parent.append(e);return e}const bars=values.map((v,id)=>{const g=el('g',{},$('bars'));el('rect',{x:0,y:-v*17,width:62,height:v*17,rx:9,stroke:'#8fa38b','stroke-width':2},g);el('text',{x:31,y:-v*17-12,fill:'#eff5ed','font-size':24,'font-weight':650,'text-anchor':'middle'},g,String(v));el('text',{x:31,y:25,fill:'#d0e9aa','font-size':18,'text-anchor':'middle'},g);el('text',{x:111+id*103,y:303,fill:'#bbcab9','font-size':14,'text-anchor':'middle'},$('positions'),`[${id}]`);return g});let index=0,timer=null,animations=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)');function cancelMotion(){animations.forEach(a=>a.cancel());animations=[]}function pause(){clearTimeout(timer);timer=null;$('play').textContent='Play'}function render(animate=false){cancelMotion();const f=frames[index];bars.forEach((g,id)=>{const pos=f.order.indexOf(id),x=80+103*pos,active=f.pair?.includes(id),done=pos>=f.sorted;g.style.transform=`translate(${x}px,250px)`;g.children[0].setAttribute('fill',done?'#617c49':active?'#736039':'#425d49');g.children[0].setAttribute('stroke',done?'#d0e9aa':active?'#f1cc79':'#8fa38b');g.children[2].textContent=done?'✓':'';if(animate&&f.swap&&active&&!reduced.matches){const from=80+103*f.before.indexOf(id),lift=id===f.pair[0]?-72:30;animations.push(g.animate([{transform:`translate(${from}px,250px)`,offset:0},{transform:`translate(${from}px,250px)`,offset:.22},{transform:`translate(${(from+x)/2}px,${250+lift}px)`,offset:.6},{transform:`translate(${x}px,250px)`,offset:1}],{duration:Math.min(1050,Number($('speed').value)*.75),easing:'ease-in-out'}));}});const x=80+103*(f.j||0);$('bracket').setAttribute('d',f.pair?`M${x} 276 v8 h165 v-8`:'');$('pass').textContent=f.pass?`Pass ${f.pass} of 4`:'Ready to sort';if(f.pair){const a=values[f.pair[0]],b=values[f.pair[1]];$('heading').textContent=f.swap?`${a} > ${b} — swap neighbors`:`${a} ≤ ${b} — keep their order`;$('reason').textContent=(f.swap?`${a} moves right; ${b} moves left.`:'These neighbors already increase from left to right.')+(f.sorted===f.j+1?` ${values[f.order[f.sorted]]} is now in its final position.`:' Continue with the next pair.');}else{$('heading').textContent=index?'Sorted. Every value has its place.':'Five values. Smallest goes left.';$('reason').textContent=index?'Each pass moved the largest remaining value to the right.':'Press Play to follow each comparison and swap.'}$('title').textContent=`Values: ${f.order.map(i=>values[i]).join(', ')}. ${$('heading').textContent}`;$('count').textContent=`Step ${index+1} of ${frames.length}`;$('seek').value=index;$('back').disabled=index===0;$('next').disabled=index===frames.length-1}function advance(){index++;render(true);if(index===frames.length-1)pause();else timer=setTimeout(advance,Number($('speed').value))}$('play').onclick=()=>{if(timer){pause();cancelMotion();return}if(index===frames.length-1){index=0;render()}$('play').textContent='Pause';advance()};$('next').onclick=()=>{pause();index=Math.min(index+1,frames.length-1);render(true)};$('back').onclick=()=>{pause();index=Math.max(index-1,0);render()};$('reset').onclick=()=>{pause();index=0;render()};$('seek').max=frames.length-1;$('seek').oninput=()=>{pause();index=Number($('seek').value);render()};$('speed').onchange=()=>{if(timer){clearTimeout(timer);timer=setTimeout(advance,Number($('speed').value))}};render();})();
</script></body></html>
